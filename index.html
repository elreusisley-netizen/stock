(function () {
  var etat = document.getElementById("etat");
  function dire(t, ko) { etat.textContent = t; etat.className = ko ? "ko" : ""; }
  window.onerror = function (m, s, l) { dire("Erreur : " + m + "  (ligne " + l + ")", true); };

  // Seul React vient de l'extérieur. Le style est intégré au fichier.
  var SOURCES = [
    ["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
     "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"],

     "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"]
  ];

  function charger(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement("script");
      s.src = url; s.crossOrigin = "anonymous";
      s.onload = ok; s.onerror = function () { ko(new Error(url)); };
      document.head.appendChild(s);
    });
  }

  function essayer(i) {
    if (i >= SOURCES.length) {
      dire("Impossible de charger React depuis les trois hébergeurs essayés.\n\n"
         + "Si tu es dans l'aperçu de l'app Claude, ouvre plutôt la page dans Safari : "
         + "l'aperçu bloque certains domaines.", true);
      return;
    }
    charger(SOURCES[i][0])
      .then(function () { return charger(SOURCES[i][1]); })
      .then(function () {
        if (!window.React || !window.ReactDOM) throw new Error("chargement incomplet");
        etat.style.display = "none";
        try { demarrer(); }
        catch (e) { etat.style.display = "block"; dire("Erreur : " + e.message, true); }
      })
      .catch(function () { essayer(i + 1); });
  }
  essayer(0);
})();
</script>
