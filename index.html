    SEED.forEach((p) => {
        const pid = "p" + next.seq++;
        const echelle = vet.test(p.l.split(" ")[0].slice(0, -1)) ? "vetement" : "eu";
        next.produits.push({ id: pid, nom: p.nom, echelle });
        p.l.split(/\s+/).filter(Boolean).forEach((tok) => {
            const taille = tok.slice(0, -1);
            const code = tok.slice(-1);
            const statut = code === "v" ? "vendu" : code === "r" ? "reserve" : "stock";
            const det = p.det && p.det[taille];
            next.articles.push({

            });

}

/* Compare l'état d'avant et d'après, et n'envoie que les différences.
   Les identifiants créés localement (p12, a34) déclenchent une insertion ;
   la base attribue alors son propre identifiant.                            */
async function synchroniser(avant, apres, org) {
    const neuf = (id) => typeof id === "string" && /^[pa]\d+$/.test(id);
    const mapP = new Map();
    // produits ajoutés
    const pNeufs = apres.produits.filter((p) => neuf(p.id));
    if (pNeufs.length) {
        const { data, error } = await sb.from("produits")
            .insert(pNeufs.map((p) => ({ organisation_id: org, nom: p.nom, echelle: p.echelle })))
            .select();
        if (error)
            throw new Error("Produits : " + error.message);
        // par nom : l'ordre de retour n'est pas garanti
        const parNom = new Map((data || []).map((r) => [r.nom.toLowerCase(), r.id]));
        pNeufs.forEach((p) => {
            const id = parNom.get(p.nom.toLowerCase());
            if (!id)
                throw new Error("Produit non créé : " + p.nom);
            mapP.set(p.id, id);
        });
    }
    // produits modifiés ou supprimés
    const avantP = new Map(avant.produits.map((p) => [p.id, p]));
    for (const p of apres.produits) {
        if (neuf(p.id))
            continue;
        const a0 = avantP.get(p.id);
        if (a0 && a0.nom !== p.nom) {
            const { error } = await sb.from("produits").update({ nom: p.nom }).eq("id", p.id);
            if (error)
                throw error;
        }
    }
    const apresP = new Set(apres.produits.map((p) => p.id));
    for (const p of avant.produits) {
        if (!apresP.has(p.id)) {
            await sb.from("produits").update({ supprime_le: new Date().toISOString() }).eq("id", p.id);
        }
    }
    // articles ajoutés
    const aNeufs = apres.articles.filter((a) => neuf(a.id));
    if (aNeufs.length) {
        const lignes = aNeufs.map((a) => {
            const pid = mapP.get(a.produitId) || a.produitId;
            if (/^p\d+$/.test(String(pid)))
                throw new Error("Produit introuvable pour un article");
            return artVersBase({ ...a, produitId: pid }, org);
        });
        for (let i = 0; i < lignes.length; i += 100) {
            const { error } = await sb.from("articles").insert(lignes.slice(i, i + 100));
            if (error) {
                throw new Error("Articles (" + (i + 1) + "/" + lignes.length + ") : " +
                    error.message + (error.hint ? " — " + error.hint : ""));
            }
        }
    }
    // articles modifiés
    const avantA = new Map(avant.articles.map((a) => [a.id, a]));
    for (const a of apres.articles) {
        if (neuf(a.id))
            continue;
        const a0 = avantA.get(a.id);
        if (!a0 || JSON.stringify(a0) === JSON.stringify(a))
            continue;
        let q = sb.from("articles").update(artVersBase(a, org)).eq("id", a.id);
        // garde-fou : si quelqu'un a changé le statut entre-temps, la mise à jour échoue
        if (a0.statut !== a.statut)
            q = q.eq("statut", a0.statut);
        const { data, error } = await q.select();
        if (error)
            throw error;
        if (a0.statut !== a.statut && (!data || !data.length)) {
            throw new Error("Cet article vient d'être modifié par quelqu'un d'autre. Recharge la page.");
        }
    }
    // articles supprimés
    const apresA = new Set(apres.articles.map((a) => a.id));
    const partis = avant.articles.filter((a) => !apresA.has(a.id) && !neuf(a.id)).map((a) => a.id);
    if (partis.length) {
        await sb.from("articles").update({ supprime_le: new Date().toISOString() }).in("id", partis);
    }
}

<script>
(function () {
  var etat = document.getElementById("etat");
  function dire(t, ko) { etat.style.display = "block"; etat.textContent = t; etat.className = ko ? "ko" : ""; }
  var demarre = false;
  window.onerror = function (m, s, l) {
    // Une fois l'application lancée, les incidents des bibliothèques externes
    // n'apportent aucune information exploitable : on les laisse à la console.
    if (demarre || String(m).indexOf("Script error") === 0) {
      console.warn("incident ignoré :", m, s, l);
      return true;
    }
    dire("Erreur : " + m + "  (ligne " + l + ")", true);
  };

  var LOTS = [
    ["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
     "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
     "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"],
    ["https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
     "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
     "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"],
    ["https://unpkg.com/react@18.3.1/umd/react.production.min.js",
     "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
     "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"]
  ];

  function charger(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement("script");
      s.src = url; s.crossOrigin = "anonymous";
      s.onload = ok; s.onerror = function () { ko(new Error(url)); };
      document.head.appendChild(s);
    });
  }

  function essayer(i) {
    if (i >= LOTS.length) {
      dire("Impossible de charger les bibliothèques. Vérifie ta connexion, puis recharge.", true);
      return;
    }
    charger(LOTS[i][0])
      .then(function () { return charger(LOTS[i][1]); })
      .then(function () { return charger(LOTS[i][2]); })
      .then(function () {
        if (!window.React || !window.ReactDOM || !window.supabase) throw new Error("incomplet");
        etat.style.display = "none";
        try { demarrer(); demarre = true; }
        catch (e) { dire("Erreur : " + (e && e.message ? e.message : e), true); }
      })
      .catch(function () { essayer(i + 1); });
  }
  essayer(0);
})();
</script>
