function construireSeed(base) {
    const next = JSON.parse(JSON.stringify(base));
    const vet = /^(M|L|XL|XXL|3XL)$/;
    SEED.forEach((p) => {

        const echelle = vet.test(p.l.split(" ")[0].slice(0, -1)) ? "vetement" : "eu";
        next.produits.push({ id: pid, nom: p.nom, echelle });

            const taille = tok.slice(0, -1);
            const code = tok.slice(-1);

            const det = p.det && p.det[taille];

        const { data, error } = await sb.from("produits")
            .insert(pNeufs.map((p) => ({ organisation_id: org, nom: p.nom, echelle: p.echelle })))
            .select();

            throw new Error("Produits : " + error.message);
        // par nom : l'ordre de retour n'est pas garanti
        const parNom = new Map((data || []).map((r) => [r.nom.toLowerCase(), r.id]));
        pNeufs.forEach((p) => {
            const id = parNom.get(p.nom.toLowerCase());
            if (!id)

            mapP.set(p.id, id);

    }
    // produits modifiés ou supprimés
    const avantP = new Map(avant.produits.map((p) => [p.id, p]));
    for (const p of apres.produits) {

        if (a0 && a0.nom !== p.nom) {

            if (error)

    const apresP = new Set(apres.produits.map((p) => p.id));
    for (const p of avant.produits) {
        if (!apresP.has(p.id)) {
            await sb.from("produits").update({ supprime_le: new Date().toISOString() }).eq("id", p.id);
        }

    const aNeufs = apres.articles.filter((a) => neuf(a.id));
